name: Apply site enhancements

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure enhancement scripts and shared data are loaded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tags = [
              '<script src="site-enhancements.js"></script>',
              '<script src="site-persistence.js"></script>'
          ]
          for tag in tags:
              if tag not in text:
                  text = text.replace('</body>', f'{tag}\n</body>')

          data_path = Path('site-data.json')
          if data_path.exists():
              data = json.loads(data_path.read_text(encoding='utf-8'))
          else:
              data = {"version":1,"sections":[],"settings":{}}
          marker_start = '<script id="neva-shared-data">'
          marker_end = '</script>'
          start = text.find(marker_start)
          if start >= 0:
              end = text.find(marker_end, start)
              if end >= 0:
                  end += len(marker_end)
                  text = text[:start] + text[end:]
          shared = json.dumps(data, ensure_ascii=False, separators=(',', ':')).replace('</script>', '<\\/script>')
          tag = f'<script id="neva-shared-data">window.__NEVA_SHARED_DATA__={shared};</script>\n'
          text = text.replace('</head>', tag + '</head>', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Provide background-logo fallback
        run: |
          if [ ! -f backlogo.svg ]; then cp logo.svg backlogo.svg; fi

      - name: Commit generated wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backlogo.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish shared site settings to frontend'
          git push
