name: Apply site enhancements

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure enhancement script is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="site-enhancements.js"></script>'
          if tag not in text:
              text = text.replace('</body>', f'{tag}\n</body>')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Provide background-logo fallback
        run: |
          if [ ! -f backlogo.svg ]; then cp logo.svg backlogo.svg; fi

      - name: Commit generated wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backlogo.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire site enhancement layer'
          git push
